name: ci

# Per-PR checks: lint, typecheck, unit + integration tests.
#
# Runs on every PR against `main` and on every push to `main`. The
# nightly eval (`.github/workflows/eval-nightly.yml`) handles the e2e
# tier against real LLM calls — this workflow does not consume
# Anthropic credits.
#
# Design: docs/decisions/0024-pr-ci-lint-mypy-tests.md

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # Cancel superseded PR runs but never cancel a main run — main
  # completion feeds the nightly eval's baseline.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          # Install ruff by itself — ruff has no runtime deps, so we
          # skip the full install to keep this job fast. The exact
          # version comes from the lock so the gate can't drift on a
          # ruff release with no repo change (ADR 0045).
          pip install "$(grep '^ruff==' requirements-lock.txt)"
      - name: Ruff check
        run: ruff check .

  typecheck:
    name: mypy (strict, src/)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install project (locked deps + dev tooling)
        # Install the frozen set first, then the package itself with
        # --no-deps so the run exercises exactly the versions the lock
        # records — pyproject stays authoritative for ranges, the lock
        # for what CI actually gates on (ADR 0045). `pip check` fails
        # the job if the lock and pyproject's ranges ever drift apart.
        run: |
          python -m pip install --upgrade pip
          # Match the production artifact before installing the public
          # `torch==X.Y.Z` pin. PEP 440 treats the official `X.Y.Z+cpu`
          # wheel as satisfying that pin, so the full lock will not
          # replace it with PyPI's CUDA-enabled Linux artifact (ADR 0054).
          torch_version=$(sed -n 's/^torch==//p' requirements-lock.txt)
          test -n "$torch_version"
          pip install --only-binary=:all: \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==$torch_version"
          pip install -r requirements-lock.txt
          pip install --no-deps -e .
          python -m pip check
      - name: Mypy strict
        # Tests use monkeypatching heavily and are not strict-typed
        # yet — a follow-up cleanup PR will bring them under the same
        # gate. Explicit src/ scope prevents accidental regressions
        # from creeping in on src/ while tests catch up.
        run: mypy --strict src/

  tests:
    name: pytest (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install project (locked deps + dev tooling)
        # Install the frozen set first, then the package itself with
        # --no-deps so the run exercises exactly the versions the lock
        # records — pyproject stays authoritative for ranges, the lock
        # for what CI actually gates on (ADR 0045). `pip check` fails
        # the job if the lock and pyproject's ranges ever drift apart.
        run: |
          python -m pip install --upgrade pip
          # Keep the test environment on the same CPU-only Torch artifact
          # as the container. Otherwise PyPI's Linux wheel installs CUDA
          # dependencies that are intentionally absent from the generated
          # runtime lock, and this gate tests a deployment we never ship.
          torch_version=$(sed -n 's/^torch==//p' requirements-lock.txt)
          test -n "$torch_version"
          pip install --only-binary=:all: \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==$torch_version"
          pip install -r requirements-lock.txt
          pip install --no-deps -e .
          python -m pip check
      - name: Add PostgreSQL to PATH (for pytest-postgresql)
        # ubuntu-latest preinstalls postgresql-16 but doesn't put its
        # bin on PATH. pytest-postgresql needs `postgres` + `pg_ctl`
        # visible so the Sprint 4 PR 4 Postgres cache tests can run
        # instead of skipping. If the binary path changes with a
        # future runner image, this fails fast rather than silently
        # skipping the integration tier.
        run: |
          pg_bin=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n1)
          echo "$pg_bin" >> "$GITHUB_PATH"
          "$pg_bin/postgres" --version
      - name: Run unit + integration tests
        # Excludes the e2e tier explicitly. Currently all tests are
        # effectively unit or integration (mocks + fakeredis +
        # pytest-postgresql, ~10s wall clock); e2e populates as
        # those tests get authored. The marker filter is the
        # durable selection knob.
        run: pytest -m "not e2e" -q

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    # Cold-cache builds install the full ML stack (torch, sentence-
    # transformers, faiss, PyMuPDF, psycopg[binary]); ~13-15min on a
    # fresh runner. Warm runs land in ~30-60s off the GHA cache.
    # 25min gives comfortable headroom for the cold path.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate compose file
        # `compose config` resolves interpolation + validates schema.
        # A dummy API key satisfies the `${VAR:?...}` gate without
        # leaking a real secret.
        run: ANTHROPIC_API_KEY=dummy docker compose config --quiet
      - name: Validate production compose overlay
        # WO-25 / 05-MIGRATION.md C2: the Hetzner overlay (ADR 0054) was
        # never schema-checked by CI, so a typo in it only surfaced on the
        # box. Mirrors the base-file check above; every `${VAR:?...}` gate
        # in the overlay gets a dummy value, which is why the list is
        # longer than one key. `config` resolves and validates only — it
        # starts nothing and reaches no network.
        env:
          ANTHROPIC_API_KEY: dummy
          WEB_API_KEY: dummy
          POSTGRES_PASSWORD: dummy
          APP_DOMAIN: ci.example.invalid
          ACME_EMAIL: ci@example.invalid
          APP_USERNAME: ci
          APP_PASSWORD_HASH: dummy
        run: |
          docker compose \
            -f docker-compose.yml \
            -f deploy/hetzner/compose.prod.yml \
            config --quiet
      - name: Build image
        # Cache the layer graph in the runner's local GHA cache — a
        # rebuild without dep changes lands in ~30s vs. ~4min cold.
        # Loaded into the local daemon so subsequent steps could
        # `docker run` against it if we add a smoke-boot step later.
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: arxiv-research-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web-image:
    name: web image smoke
    # WO-25 / 05-MIGRATION.md C1: `docker-build` above covers the API
    # image only, so nothing proved the web image boots or that its
    # server-side /api proxy resolves. This builds ./web, runs it against
    # a dependency-free stub upstream, and asserts HTTP 200 on `/` and on
    # `/api/healthz` — the latter only returns 200 if the proxy reached
    # the upstream (it answers 503 on a bad API_INTERNAL_BASE and 502 when
    # the upstream is unreachable). No Anthropic key is involved: the web
    # image never takes one, and the stub refuses /research outright.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Keep in lockstep with web/Dockerfile and the `web` job.
          node-version: "22"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build web image
        # Separate cache scope from the API image so the two builds do
        # not evict each other from the GHA cache.
        uses: docker/build-push-action@v6
        with:
          context: ./web
          load: true
          tags: arxiv-research-agent-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Start stub upstream
        run: |
          node web/e2e/support/stub-upstream.mjs >"$RUNNER_TEMP/stub.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/stub.pid"
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/healthz; then break; fi
            sleep 0.5
          done
      - name: Run web image against the stub
        # host-gateway is how the container reaches a plain-node process on
        # the runner; the alternative (--network host) would also drop the
        # published-port boundary the probe below exercises.
        run: |
          docker run -d --name web-image-smoke \
            -p 127.0.0.1:3000:3000 \
            --add-host host.docker.internal:host-gateway \
            -e API_INTERNAL_BASE=http://host.docker.internal:8000 \
            arxiv-research-agent-web:ci
      - name: Probe / and /api/healthz
        run: |
          set -u
          # Boot wait first, so the two assertions below are strict:
          # anything other than 200 fails immediately rather than being
          # retried into a pass.
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/; then break; fi
            sleep 1
          done
          fail=0
          for path in / /api/healthz; do
            code=$(curl -s -o "$RUNNER_TEMP/body" -w '%{http_code}' \
              "http://127.0.0.1:3000${path}")
            echo "GET ${path} -> ${code}"
            head -c 300 "$RUNNER_TEMP/body"; echo
            [ "$code" = "200" ] || fail=1
          done
          exit "$fail"
      - name: Container and stub logs on failure
        if: failure()
        run: |
          docker logs web-image-smoke || true
          cat "$RUNNER_TEMP/stub.log" || true
      - name: Tear down
        if: always()
        run: |
          docker rm -f web-image-smoke || true
          kill "$(cat "$RUNNER_TEMP/stub.pid")" 2>/dev/null || true

  web:
    name: web (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 = current LTS (maintained to 2027-04-30); Node 20
          # went EOL 2026-04-30. Keep in lockstep with web/Dockerfile.
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Contract drift check (generated types)
        # WO-04 / 04-ARCHITECTURE.md §3.5 check 2: regenerate
        # lib/api/generated/schema.d.ts from the committed
        # contract/openapi.json and fail on any byte difference. Needs no API
        # and no network — both inputs are in the repository, and
        # `openapi-typescript` is pinned to an exact version so its own output
        # format is part of the comparison. The producer end of the same
        # contract is `tests/test_contract_openapi_snapshot.py` in the `tests`
        # job, which asserts the snapshot still equals `create_app().openapi()`.
        run: npm run contract:check
      - name: Vitest
        run: npm run test
      - name: Next.js build
        # Validates the full production build, including static
        # generation of `/` and the server-side `/api` proxy route.
        # The proxy resolves API_INTERNAL_BASE only when requested, so
        # no API service or secret is needed at build time.
        run: npm run build
