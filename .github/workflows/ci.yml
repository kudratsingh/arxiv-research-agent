name: ci

# Per-PR checks: lint, typecheck, the whole Python suite — every tier,
# under coverage — and the web tiers (coverage, dependency audit, route
# budgets, Storybook, browser).
#
# NINE JOBS, WHICH IS NINE CHECKS, AND WO-A13 DID NOT CHANGE THAT. Five
# Python tiers and two coverage floors became gates in that work order
# and not one of them became a job: they are steps inside `tests`,
# because a job costs a runner spin-up and a full ML install before its
# first assertion while these tiers cost seconds. A job of its own is
# for a gate that can hang, or one whose failure would be misattributed
# — which is `web-audit`, and the reasoning is written out there.
#
# Runs on every PR against `main` and on every push to `main`. The
# nightly eval (`.github/workflows/eval-nightly.yml`) is the only
# workflow in this repository that makes real model calls; this one does
# not consume Anthropic credits. Two different tiers are called "e2e"
# here and only one of them could ever cost money: `pytest -m e2e`
# (inside `tests`) drives whole workflows in mock mode for nothing, and
# `web-e2e` brings up the local Compose stack with
# `ANTHROPIC_API_KEY=local-preview-disabled`, a deliberately invalid
# sentinel. No job here is given the repository secret.
#
# Design: docs/decisions/0024-pr-ci-lint-mypy-tests.md; the web tiers are
# docs/revamp/04-ARCHITECTURE.md §7.5 and docs/revamp/05-MIGRATION.md §3
# items C4, C7, C8, C9, C10 (WO-24), on top of C1/C2 (WO-25).
#
# EVERY NETWORK STEP IN THIS FILE IS BOUNDED. Each `npm ci` carries a
# step-level `timeout-minutes` and npm fetch settings (the reasoning is written
# out once, on the `web` job's install step); the Playwright browser download,
# both image builds, the e2e stack bring-up and all three `pip install` steps
# carry their own. A job-level ceiling is a backstop for the job, not a bound
# on a step that hangs — on 2026-09-04 an unbounded advisory-endpoint call
# inside `web` consumed that job's whole 15 minutes and its four real gates
# were cancelled unreported. `web-audit` exists because of that day.
#
# That sentence was written before it was true, which is the kind of claim
# WO-A14 exists to stop. Until WO-B2 the three `pip install` steps, the API
# image build and the e2e `compose up` carried no step bound at all — five
# network steps under a heading that says there are none. Each is bounded now
# against its own measurement (run 33936777399, with 33935998295 as a second
# sample), under one rule: high enough that only a hang reaches it, low enough
# that the job's remaining steps still get to run and report. Reporting is what
# the 2026-09-04 incident actually cost, not wall clock.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # WO-24 criterion 4 / 04 §7.5: "only chromium E2E runs per PR, the full
    # browser matrix ... runs nightly, so PR wall-clock stays bounded". This
    # is that nightly. The whole workflow runs, not just `web-e2e` — every
    # other job is deterministic and cheap enough that splitting the trigger
    # per job would cost more `if:` conditions on jobs this work order does
    # not own than the runner minutes are worth, and a nightly full run also
    # catches drift that no PR touches (a base-image change, a transitive
    # dependency that went red overnight). `web-e2e` is the ONLY job whose
    # behaviour differs by event.
    #
    # 03:20 UTC, ahead of the nightly eval's 04:00 and off the hour.
    - cron: "20 3 * * *"
  # Same full-matrix behaviour on demand, for when a browser-specific
  # regression is suspected between nightlies.
  workflow_dispatch:

concurrency:
  # Cancel superseded PR runs but never cancel a main run — main
  # completion feeds the nightly eval's baseline.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install lint tooling
        # 2 s measured (33936777399), 3 s on 33935998295 — two small wheels
        # against a warm setup-python cache, and a cold miss is still two small
        # wheels. A multiple of a two-second step is not a bound, so this one
        # is chosen from the other end: three minutes of a five-minute job
        # spent not reaching PyPI is unambiguous, and it still leaves `ruff
        # check` (1 s measured) two minutes to run and report.
        timeout-minutes: 3
        run: |
          python -m pip install --upgrade pip
          # Install ruff by itself — ruff has no runtime deps, so we
          # skip the full install to keep this job fast. The exact
          # version comes from the lock so the gate can't drift on a
          # ruff release with no repo change (ADR 0045).
          pip install "$(grep '^ruff==' requirements-lock.txt)"
      - name: Ruff check
        run: ruff check .

  typecheck:
    name: mypy (strict, src/)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install project (locked deps + dev tooling)
        # Install the frozen set first, then the package itself with
        # --no-deps so the run exercises exactly the versions the lock
        # records — pyproject stays authoritative for ranges, the lock
        # for what CI actually gates on (ADR 0045). `pip check` fails
        # the job if the lock and pyproject's ranges ever drift apart.
        #
        # 82 s measured here (33936777399) and 89 s on 33935998295. Seven
        # minutes is ~5x that, the same multiple the Playwright download's
        # bound uses, and it is the tighter of the two jobs that run this
        # identical command: it has to leave `mypy --strict` (58 s measured)
        # room inside this job's 10-minute ceiling. `tests` carries the same
        # number because it is the same install, not because it needs it.
        timeout-minutes: 7
        run: |
          python -m pip install --upgrade pip
          # Match the production artifact before installing the public
          # `torch==X.Y.Z` pin. PEP 440 treats the official `X.Y.Z+cpu`
          # wheel as satisfying that pin, so the full lock will not
          # replace it with PyPI's CUDA-enabled Linux artifact (ADR 0054).
          torch_version=$(sed -n 's/^torch==//p' requirements-lock.txt)
          test -n "$torch_version"
          pip install --only-binary=:all: \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==$torch_version"
          pip install -r requirements-lock.txt
          pip install --no-deps -e .
          python -m pip check
      - name: Mypy strict
        # Tests use monkeypatching heavily and are not strict-typed
        # yet — a follow-up cleanup PR will bring them under the same
        # gate. Explicit src/ scope prevents accidental regressions
        # from creeping in on src/ while tests catch up.
        run: mypy --strict src/

  tests:
    name: pytest (all tiers + coverage)
    # THE FIVE TIERS, AND WHY THEY ARE STEPS RATHER THAN JOBS (WO-A13).
    #
    # Until this work order the whole Python gate was one line —
    # `pytest -m "not e2e" -q` — and not one of the five tiers built
    # during the assurance phase gated as a tier. `property`, `fault` and
    # `security` are purpose markers *inside* that selection, so they ran
    # incidentally: a failure was caught, but nothing named the tier and
    # nothing would notice if one stopped selecting tests. `e2e` was
    # excluded by the filter outright, so sixteen end-to-end tests ran
    # nowhere. Coverage was measured by `make test-cov` on somebody's
    # desk and enforced nowhere — the same asymmetry the web half closed
    # in WO-24, thresholds there and prose here.
    #
    # All of it lands here as steps, and the arithmetic is one-sided.
    # Measured on the runner rather than estimated — this job's steps on
    # run 33922969316, against the same job on `main` at run 33919723995:
    #
    #   install (unchanged)            82 s   (87 s on main)
    #   the suite, now instrumented   183 s   (108 s uninstrumented)
    #   patch coverage                  1 s   (re-reads the XML above)
    #   e2e tier                       14 s
    #   safety report + gate            3 s   (two passes)
    #   the two new uploads             1 s
    #   ---------------------------------------------------------------
    #   job end to end                299 s   (214 s on main)
    #
    # Eighty-five seconds. A job of its own would buy each of those a
    # runner spin-up plus this job's 82-second install of the full ML
    # stack, torch included — minutes for seconds of tests — and would
    # turn a nine-check PR into a fourteen-check one. The `web dependency
    # audit` split is what a separate job is actually for: that gate calls
    # a remote service that can hang, and on a bad day it cancelled four
    # gates that had nothing to do with it. Nothing in this job touches
    # the network.
    #
    # What the choice costs, stated plainly: steps are sequential, so a
    # red coverage floor hides the e2e result until the next run. Accepted
    # — the alternative is paying an install per tier for attribution that
    # a pytest node id already gives for free.
    #
    # And what it does not fix, recorded rather than hidden: `property`,
    # `fault` and `security` gate because they are inside the selection,
    # so an emptied tier would still be silent here. Running each one on
    # its own would cost ~30 s of re-collection to buy an attribution the
    # node id already carries; the check that actually closes it is a
    # census beside the tier-marker census in
    # `tests/test_harness_guards.py`, where it costs nothing per run.
    # That file belongs to another work order, so this is a gap with an
    # address rather than a shrug.
    runs-on: ubuntu-latest
    # Was 10 when this job ran one uninstrumented pytest invocation and
    # finished in 214 s. It is 299 s now (numbers above), and the ceiling
    # also has to cover a cold pip resolve when the lock changes and the
    # setup-python cache misses. 15 is headroom, not a budget: a job that
    # dies at its ceiling reports nothing at all, which is the exact
    # failure `web-audit` was split out to prevent.
    timeout-minutes: 15
    env:
      # Never a real key, in a job that now runs the e2e tier and the
      # adversarial safety suite as well as the unit and integration
      # tiers. `tests/conftest.py` denies the Anthropic client constructor
      # on top of it and the Makefile targets pin the same value at their
      # own call sites; this is the outermost of the three layers.
      ANTHROPIC_API_KEY: local-preview-disabled
    steps:
      - uses: actions/checkout@v4
        with:
          # diff-cover asks git for the merge base against `origin/main`,
          # and the default shallow fetch hands it a single commit with no
          # shared history to find one in. 0 is "all branches and tags" —
          # a 17 MB pack, a couple of seconds, and the only job in this
          # file that needs it.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install project (locked deps + dev tooling)
        # Install the frozen set first, then the package itself with
        # --no-deps so the run exercises exactly the versions the lock
        # records — pyproject stays authoritative for ranges, the lock
        # for what CI actually gates on (ADR 0045). `pip check` fails
        # the job if the lock and pyproject's ranges ever drift apart.
        #
        # Same bound as `typecheck`'s copy of this step, and the reasoning is
        # written out there. 80 s measured here (33936777399), 72 s on
        # 33935998295; seven minutes leaves eight of this job's fifteen for a
        # remainder that measures 200 s, which is every gate below getting to
        # report rather than being cancelled behind a stuck install.
        timeout-minutes: 7
        run: |
          python -m pip install --upgrade pip
          # Keep the test environment on the same CPU-only Torch artifact
          # as the container. Otherwise PyPI's Linux wheel installs CUDA
          # dependencies that are intentionally absent from the generated
          # runtime lock, and this gate tests a deployment we never ship.
          torch_version=$(sed -n 's/^torch==//p' requirements-lock.txt)
          test -n "$torch_version"
          pip install --only-binary=:all: \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==$torch_version"
          pip install -r requirements-lock.txt
          pip install --no-deps -e .
          python -m pip check
      - name: Add PostgreSQL to PATH (for pytest-postgresql)
        # ubuntu-latest preinstalls postgresql-16 but doesn't put its
        # bin on PATH. pytest-postgresql needs `postgres` + `pg_ctl`
        # visible so the Sprint 4 PR 4 Postgres cache tests can run
        # instead of skipping. If the binary path changes with a
        # future runner image, this fails fast rather than silently
        # skipping the integration tier.
        run: |
          pg_bin=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n1)
          echo "$pg_bin" >> "$GITHUB_PATH"
          "$pg_bin/postgres" --version
      - name: Unit + integration tiers under coverage (project + package floors)
        # `make test-cov`, not a pytest line copied into this file, and the
        # floors are the entire reason. The project floor lives in
        # pyproject.toml (`[tool.coverage.report].fail_under`); the four
        # per-package floors live in the Makefile (COV_API, COV_AGENTS,
        # COV_SECURITY, COV_EVAL) because coverage.py's `fail_under` is
        # global and a project number can hold steady while the one package
        # that matters rots underneath it. A workflow that restated any of
        # those five numbers would be a second copy of a ratchet, and the
        # copy that CI enforces would be the one nobody edits.
        # `VENV_PYTHON=python` is the whole adaptation: the target calls
        # `$(VENV_PYTHON)`, which is `.venv/bin/python` on a desk and does
        # not exist on a runner, and a command-line assignment overrides a
        # makefile one.
        #
        # It brings TEST_ENV with it — OMP_NUM_THREADS=1,
        # TOKENIZERS_PARALLELISM=false, PYTHONHASHSEED=0 — which the bare
        # `pytest` this step replaced never set. CI has been running the
        # suite without the parent interpreter's hash seed pinned, so a
        # dict-ordering-dependent failure here was reproducible only by
        # luck (ADR 0065).
        #
        # SELECTION IS STILL `-m "not e2e"`, deliberately: that is the set
        # the floors were measured against, as pyproject's own comment
        # says. The e2e tier runs below and uninstrumented, so sixteen
        # extra tests cannot quietly lift the project number and
        # re-baseline a floor as a side effect of finally being run.
        #
        # PYTEST_ADDOPTS appends the XML that the patch-coverage step and
        # WO-A14's evidence pack read; `tee` keeps the target's own
        # term-missing report and its four per-package lines for the
        # artifact. `set -o pipefail` because this step's shell is
        # `bash -e {0}`, where a floor breach piped into `tee` would exit
        # 0 and pass.
        #
        # The runner measures HIGHER than a desk — 92.39% against 91.31%
        # on the same commit, with 2 tests skipped here against 55 there
        # — because Postgres is on PATH two steps up and the integration
        # tests that skip on a laptop run. That is the argument for
        # leaving the floors where they are rather than ratcheting them
        # to this number: a floor lifted to the CI measurement is a floor
        # no developer can meet before pushing.
        env:
          PYTEST_ADDOPTS: --cov-report=xml:build/coverage.xml
        run: |
          set -o pipefail
          mkdir -p build
          make test-cov VENV_PYTHON=python | tee build/coverage-summary.txt

      - name: Patch coverage (the lines this change touched)
        # The project floor is a ratchet; this is the question a reviewer
        # actually has. Project coverage improves logarithmically, so a
        # large untested diff barely moves it — which is why COV_DIFF (90)
        # is higher than every project floor in the Makefile, and why this
        # is the coverage gate that earns its keep on a PR.
        #
        # It reads the XML the step above already wrote instead of running
        # pytest again. That is the ONLY difference from `make
        # test-cov-diff`, which re-runs the suite because on a desk you may
        # not have a fresh report; branch, floor and behaviour are
        # otherwise identical on purpose, so the local target and this gate
        # cannot disagree about the same PR. The floor is read out of the
        # Makefile for the same reason the torch pin is read out of the
        # lock above: one definition, and a `test -n` so a rename of the
        # variable fails loudly instead of silently gating on nothing.
        #
        # On a push to `main` the diff against origin/main is empty;
        # diff-cover reports "no lines with coverage information in this
        # diff" and exits 0.
        run: |
          cov_diff=$(sed -n 's/^COV_DIFF *:= *//p' Makefile)
          test -n "$cov_diff"
          python -m diff_cover.diff_cover_tool build/coverage.xml \
            --compare-branch=origin/main \
            --fail-under="$cov_diff" \
            --show-uncovered \
            --format "html:build/patch-coverage.html"

      - name: Upload Python coverage
        # `always()`, for the reason the route-budget report uploads on a
        # breach: the run that broke a floor is the run whose report is
        # worth reading. The XML is what diff-cover and WO-A14's evidence
        # pack consume, the summary is the human copy, and the HTML names
        # which of the PR's own lines are missing — the question a red
        # patch-coverage step raises and a log line cannot answer.
        #
        # 30 days rather than the web tiers' 14: Gate A3 cites these, and
        # a retention window shorter than a review cycle makes a citation
        # that resolves to nothing.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: |
            build/coverage.xml
            build/coverage-summary.txt
            build/patch-coverage.html
          if-no-files-found: warn
          retention-days: 30

      - name: E2E tier (whole workflows, zero spend)
        # RUN PER PR, DELIBERATELY. WO-A15 built this tier and the filter
        # above still excluded it, so sixteen real end-to-end tests ran
        # nowhere but on a desk. They cost 5 s measured, in a job that
        # already has the interpreter, the dependencies and Postgres on
        # PATH: there is no budget argument for excluding them and no
        # isolation argument for a job of their own. It is also the only
        # tier that drives the router's revision branch, the HITL resume
        # and the SSE frame trajectory end to end — the class of break ADR
        # 0040 records — which is precisely what a merge should be gated
        # on.
        #
        # `make test-e2e` rather than a pytest line: same one-definition
        # argument as the coverage step, and the target is where
        # USE_MOCK_DATA=true and the disabled-key sentinel are pinned.
        # Zero spend is structural underneath both — `tests/conftest.py`
        # denies the client constructor and `tests/e2e/conftest.py`
        # installs its own mock-mode Settings — so the pins are the layer
        # a reader can check without opening a conftest.
        run: make test-e2e VENV_PYTHON=python

      # The adversarial safety suite (ADR 0072): the authored 42-case
      # corpus run against this checkout's own defences, deterministically
      # and with zero model calls. Two invocations because the CLI either
      # writes its machine-readable report or gates on it, never both in
      # one pass, and a pass costs 0.7 s.
      - name: Adversarial safety report (attack-success rate)
        # `--write-baseline` is named for its main use — refreshing
        # tests/fixtures/safety/baseline.json when a case is added — but
        # what it does is write THIS run's report to a path and skip the
        # gate. That report is the artifact: attack-success rate with its
        # denominator, the Wilson interval, the per-ASI-category
        # breakdown, and the three hard-violation classes at their counts.
        # Gate A3.7 asks for exactly that, and a measured file beats a
        # figure somebody retyped into a document.
        #
        # Under `build/`, never over the committed baseline. A baseline a
        # CI run can rewrite is not a baseline — it moves in a PR that
        # says why, or it does not move.
        run: python -m src.eval.safety_suite --write-baseline build/safety/safety-report.json

      - name: Adversarial safety gate (binding veto, advisory delta)
        # No `--enforce`, and that is not a softening. ADR 0072's own
        # follow-up list says to wire this in advisory first and flip
        # `--enforce` once the baseline has survived a few campaigns — and
        # the enforcing form is already binding on this PR by another
        # route, because `tests/test_safety_suite.py` asserts
        # `main(["--enforce"]) == 0` and that test ran in the coverage step
        # above as part of the security tier. A delta regression is
        # therefore red today, reported as the test failure it is. What
        # this step adds is the rendered report beside the artifact, in the
        # log, where a reviewer reads it.
        #
        # The safety veto blocks in advisory mode too: a secret
        # exfiltrated, an unauthorised tool called, or egress to a
        # non-allowlisted host exits non-zero here whatever the flag says.
        # Absolute zero is not a statistical claim and no baseline can
        # soften it.
        run: |
          set -o pipefail
          mkdir -p build/safety
          python -m src.eval.safety_suite | tee build/safety/safety-gate.txt

      - name: Upload the attack-success rate
        # `always()`: the run where the gate went red is the run whose ASR
        # you most need to read. Same 30-day retention as the coverage
        # artifact, and for the same reason — Gate A3.7 cites it.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-attack-success-rate
          path: build/safety
          if-no-files-found: warn
          retention-days: 30

      # WO-W11 c3. The learner-simulation benchmark's scripted tier, run
      # as a campaign rather than as a unit test: every scenario driven
      # through the real compiled session graph, records written to
      # disk, and the resulting summary.jsonl asserted complete and free.
      #
      # Why here and not only in pytest: the unit tests exercise
      # `run_scenario`, this exercises the *campaign* — the CLI, the
      # durable record layout, the summary files, the cost accounting —
      # which is the surface the nightly funded lane uses, and the
      # artifact WO-W19 cites. ~2 s locally on the full 15-scenario set.
      #
      # Zero spend is structural, not hoped for: USE_MOCK_DATA=true keeps
      # the graph on its mock path, the key is the same deliberately
      # invalid sentinel every other job in this file uses, and
      # `simulate_learner` refuses the scripted tier outright when
      # USE_MOCK_DATA is false. The check then asserts $0.0000 and a zero
      # call count on every row, so a session that quietly reached a
      # model fails the job.
      - name: Scripted learner simulation (zero spend)
        env:
          USE_MOCK_DATA: "true"
          ANTHROPIC_API_KEY: local-preview-disabled
          ENABLE_CHECKPOINTING: "true"
        run: |
          python -m src.eval.simulate_learner \
            --output-dir outputs/eval/ci-scripted-tier
          python -m src.eval.scripted_tier_check \
            outputs/eval/ci-scripted-tier/summary.jsonl

      - name: Upload scripted simulation summary
        # `always()` so a failed assertion still leaves the evidence
        # behind: the summary is what says *which* session regressed,
        # and it is the artifact the Gate W1 evidence pack cites.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scripted-simulation-summary
          path: outputs/eval/ci-scripted-tier
          if-no-files-found: warn
          retention-days: 30

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    # Cold-cache builds install the full ML stack (torch, sentence-
    # transformers, faiss, PyMuPDF, psycopg[binary]); ~13-15min on a
    # fresh runner. Warm runs land in ~30-60s off the GHA cache.
    # 25min gives comfortable headroom for the cold path.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate compose file
        # `compose config` resolves interpolation + validates schema.
        # A dummy API key satisfies the `${VAR:?...}` gate without
        # leaking a real secret.
        run: ANTHROPIC_API_KEY=dummy docker compose config --quiet
      - name: Validate production compose overlay
        # WO-25 / 05-MIGRATION.md C2: the Hetzner overlay (ADR 0054) was
        # never schema-checked by CI, so a typo in it only surfaced on the
        # box. Mirrors the base-file check above; every `${VAR:?...}` gate
        # in the overlay gets a dummy value, which is why the list is
        # longer than one key. `config` resolves and validates only — it
        # starts nothing and reaches no network.
        env:
          ANTHROPIC_API_KEY: dummy
          WEB_API_KEY: dummy
          POSTGRES_PASSWORD: dummy
          APP_DOMAIN: ci.example.invalid
          ACME_EMAIL: ci@example.invalid
          APP_USERNAME: ci
          APP_PASSWORD_HASH: dummy
        run: |
          docker compose \
            -f docker-compose.yml \
            -f deploy/hetzner/compose.prod.yml \
            config --quiet
      - name: Validate observability overlays
        # WO-INF1. The same treatment for the two optional layers in
        # `deploy/observability/`, checked BOTH as the pair an operator
        # runs to collect and as the trio they run to look. Neither is
        # in the default path — `test_the_default_compose_path_does_not
        # _reference_the_overlay` fails the build if that ever changes —
        # so nothing else in CI would ever resolve these files, and a
        # typo in one would surface on somebody's box during an
        # incident. Resolves and validates only; starts nothing.
        env:
          ANTHROPIC_API_KEY: dummy
        run: |
          docker compose \
            -f docker-compose.yml \
            -f deploy/observability/compose.observability.yml \
            config --quiet
          docker compose \
            -f docker-compose.yml \
            -f deploy/observability/compose.observability.yml \
            -f deploy/observability/compose.viewers.yml \
            config --quiet
      - name: Check the alert rules parse (promtool)
        # WO-INF1, and the highest-value line in it. `alerts.yml` has
        # carried 17 rules since ADR 0073 and nothing had ever PARSED
        # them: `tests/test_operability_docs.py` reads the file as YAML
        # and checks the metric names against `src/`, which is a real
        # gate and is not the same gate — a rule whose `expr` is
        # unparseable PromQL, whose `for:` is not a duration, or whose
        # group is malformed passes every test in that file and is
        # rejected by Prometheus at load, which is to say during the
        # first incident it was written for.
        #
        # Run through the SAME pinned image the overlay evaluates them
        # with, so the checker and the evaluator cannot drift apart;
        # `test_ci_checks_the_alert_rules_with_promtool` asserts the two
        # tags agree.
        #
        # Both invocations, because they cover different halves.
        # `check rules` guarantees the rule file itself is checked.
        # `check config` follows `rule_files:` out of `prometheus.yml`,
        # which additionally proves the path the container will actually
        # load from resolves — but would happily report "0 rule files
        # found" and succeed if that stanza were ever deleted.
        run: |
          docker run --rm --entrypoint promtool \
            -v "${PWD}/deploy/observability:/etc/prometheus:ro" \
            prom/prometheus:v3.7.3 \
            check rules /etc/prometheus/alerts.yml
          docker run --rm --entrypoint promtool \
            -v "${PWD}/deploy/observability:/etc/prometheus:ro" \
            prom/prometheus:v3.7.3 \
            check config /etc/prometheus/prometheus.yml
      - name: Build image
        # Cache the layer graph in the runner's local GHA cache — a
        # rebuild without dep changes lands in ~30s vs. ~4min cold.
        # Loaded into the local daemon so subsequent steps could
        # `docker run` against it if we add a smoke-boot step later.
        #
        # 43 s measured (33936777399), 45 s on 33935998295 — both warm. The 5x
        # rule the other bounds use does not apply here: this step's cold path
        # is ~20x its warm one (the job comment above records 13-15 min), so
        # the bound comes off the job's ceiling instead. Twenty-two leaves
        # three minutes for the checkout, the buildx setup, the four compose
        # validations and the promtool check — the last of which pulls the
        # pinned Prometheus image, so the pre-build steps now measure in the
        # tens of seconds rather than under ten — and unlike every
        # other bound in this file it buys no rescued report, because this is
        # the job's last step. What it buys is a failure that names the step
        # rather than a job killed at its ceiling with no line saying why.
        timeout-minutes: 22
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: arxiv-research-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web-image:
    name: web image smoke
    # WO-25 / 05-MIGRATION.md C1: `docker-build` above covers the API
    # image only, so nothing proved the web image boots or that its
    # server-side /api proxy resolves. This builds ./web, runs it against
    # a dependency-free stub upstream, and asserts HTTP 200 on `/` and on
    # `/api/healthz` — the latter only returns 200 if the proxy reached
    # the upstream (it answers 503 on a bad API_INTERNAL_BASE and 502 when
    # the upstream is unreachable). No Anthropic key is involved: the web
    # image never takes one, and the stub refuses /research outright.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Keep in lockstep with web/Dockerfile and the `web` job.
          node-version: "22"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build web image
        # Separate cache scope from the API image so the two builds do
        # not evict each other from the GHA cache.
        #
        # This job's `npm ci` is the one inside web/Dockerfile, so the
        # NPM_CONFIG_FETCH_* env the other web jobs set cannot reach it — those
        # are runner-process variables and this install runs in a build
        # container. (Threading them through would mean `ARG`s in the
        # Dockerfile, which changes the shipped image's build contract for a CI
        # concern; not worth it.) A step bound is what is available, and it is
        # the part that matters: 18 s measured on a green run (33731289742) and
        # 1m21s on the degraded one, so 12 min is a wide ceiling that still
        # leaves the smoke probes below room to run and report inside the
        # job's 15.
        timeout-minutes: 12
        uses: docker/build-push-action@v6
        with:
          context: ./web
          load: true
          tags: arxiv-research-agent-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Start stub upstream
        run: |
          node web/e2e/support/stub-upstream.mjs >"$RUNNER_TEMP/stub.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/stub.pid"
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/healthz; then break; fi
            sleep 0.5
          done
      - name: Run web image against the stub
        # host-gateway is how the container reaches a plain-node process on
        # the runner; the alternative (--network host) would also drop the
        # published-port boundary the probe below exercises.
        run: |
          docker run -d --name web-image-smoke \
            -p 127.0.0.1:3000:3000 \
            --add-host host.docker.internal:host-gateway \
            -e API_INTERNAL_BASE=http://host.docker.internal:8000 \
            arxiv-research-agent-web:ci
      - name: Probe / and /api/healthz
        run: |
          set -u
          # Boot wait first, so the two assertions below are strict:
          # anything other than 200 fails immediately rather than being
          # retried into a pass.
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/; then break; fi
            sleep 1
          done
          fail=0
          for path in / /api/healthz; do
            code=$(curl -s -o "$RUNNER_TEMP/body" -w '%{http_code}' \
              "http://127.0.0.1:3000${path}")
            echo "GET ${path} -> ${code}"
            head -c 300 "$RUNNER_TEMP/body"; echo
            [ "$code" = "200" ] || fail=1
          done
          exit "$fail"
      - name: Probe the CSP header and the container healthcheck
        # WO-30. Two things only the real image can prove, and both are cheap
        # here because the container is already up.
        #
        #   1. The enforcing CSP with a per-request nonce is on `/`, and the
        #      middleware's excluded paths carry the inert policy instead of
        #      nothing. The browser sweep (web/e2e/csp.spec.ts, `@csp`) is the
        #      real gate; this catches a build that shipped no middleware at
        #      all, which the sweep would only report five minutes later.
        #   2. `scripts/healthcheck.mjs` runs INSIDE the image. `output:
        #      standalone` traces the server's imports and not the daemon's
        #      probe, so a missing COPY in web/Dockerfile makes every
        #      deployment's healthcheck fail — with the container reported
        #      unhealthy and no clue why. It exits 0 here against the stub.
        run: |
          set -eu
          csp=$(curl -sS -D- -o /dev/null http://127.0.0.1:3000/ \
            | tr -d '\r' | grep -i '^content-security-policy:')
          echo "$csp"
          # Two independent checks rather than one ordered glob: the tokens
          # appear as `'nonce-…' 'strict-dynamic'`, and a single pattern
          # pinning their order tests the spelling of this step instead of
          # the policy. (It did exactly that on the first run.)
          case "$csp" in
            *"'nonce-"*) ;;
            *) echo "no per-request nonce in the CSP on /"; exit 1 ;;
          esac
          case "$csp" in
            *"'strict-dynamic'"*) ;;
            *) echo "no 'strict-dynamic' in the CSP on /"; exit 1 ;;
          esac
          inert=$(curl -sS -D- -o /dev/null http://127.0.0.1:3000/api/healthz \
            | tr -d '\r' | grep -i '^content-security-policy:')
          echo "$inert"
          case "$inert" in
            *"default-src 'none'"*) ;;
            *) echo "/api/healthz carries no inert policy"; exit 1 ;;
          esac
          docker exec web-image-smoke node scripts/healthcheck.mjs
      - name: Container and stub logs on failure
        if: failure()
        run: |
          docker logs web-image-smoke || true
          cat "$RUNNER_TEMP/stub.log" || true
      - name: Tear down
        if: always()
        run: |
          docker rm -f web-image-smoke || true
          kill "$(cat "$RUNNER_TEMP/stub.pid")" 2>/dev/null || true

  web:
    name: web (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    # Four gates live here and every one of them is local compute: typecheck,
    # ESLint + contract drift, Vitest with coverage thresholds, and the
    # production build under `npm run budgets`. Measured end to end on a green
    # run they are ~4 min (run 33731289742: 4m50s including the audit this job
    # no longer runs), and the only step in the job that touches the network is
    # `npm ci`, which now carries its own bound below.
    #
    # The dependency audit used to run here, right after `npm ci`. It is a
    # network-bound call to npm's advisory endpoint with no bound of its own,
    # and on 2026-09-04 that endpoint degraded: the audit took 9m37s (run
    # 33847548135) and 4m52s (run 33847950556) on top of a 4-7 min install, so
    # this job hit the 15-minute ceiling and was CANCELLED before Vitest and
    # the build finished — three PRs and three main runs produced no test
    # result at all because of an advisory lookup. It is now `web-audit`, its
    # own job with its own timeouts, so a slow registry costs one cheap rerun
    # of one job instead of every gate in this one.
    #
    # 15 stays as headroom for a cold npm cache plus the coverage and build
    # tiers; it is no longer a budget the registry can spend.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 = current LTS (maintained to 2027-04-30); Node 20
          # went EOL 2026-04-30. Keep in lockstep with web/Dockerfile.
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        # THE NPM FETCH BOUNDS, stated once here and referenced by every other
        # `npm ci` in this repository's workflows.
        #
        # npm's defaults are fetch-timeout 300000 (five minutes PER REQUEST),
        # fetch-retries 2 and fetch-retry-maxtimeout 60000 — so a single
        # unresponsive registry request can burn ~15 min inside a step that
        # declares no bound, which is exactly what happened on 2026-09-04.
        # The values below are sized from the measured healthy shape: this
        # whole install is 16-19 s on a green run (33731289742).
        #
        #   FETCH_TIMEOUT 60000        a request that has not answered in 60 s
        #                              is not going to; fail it and retry.
        #   FETCH_RETRIES 2            npm's default, kept deliberately — a
        #                              flaky request should still be retried.
        #                              The defect was the five-minute attempt,
        #                              not the retry.
        #   FETCH_RETRY_MAXTIMEOUT     caps the backoff between attempts at
        #     20000                    20 s instead of 60 s.
        #
        # Worst case for one request is therefore 60 + 10 + 60 + 20 + 60 =
        # 210 s, inside the 5-minute step bound — which is itself ~15x the
        # measured install, so it only ever fires on a degraded registry.
        timeout-minutes: 5
        env:
          NPM_CONFIG_FETCH_TIMEOUT: "60000"
          NPM_CONFIG_FETCH_RETRIES: "2"
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "20000"
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Contract drift check (generated types)
        # WO-04 / 04-ARCHITECTURE.md §3.5 check 2: regenerate
        # lib/api/generated/schema.d.ts from the committed
        # contract/openapi.json and fail on any byte difference. Needs no API
        # and no network — both inputs are in the repository, and
        # `openapi-typescript` is pinned to an exact version so its own output
        # format is part of the comparison. The producer end of the same
        # contract is `tests/test_contract_openapi_snapshot.py` in the `tests`
        # job, which asserts the snapshot still equals `create_app().openapi()`.
        run: npm run contract:check
      - name: Vitest (with coverage thresholds)
        # WO-24 / 05-MIGRATION.md C10. The thresholds live in
        # web/vitest.config.mts, seeded at the measured value and ratcheted by
        # each work order that raises them; `--coverage` is what makes them a
        # gate rather than a comment. Vitest merges coverage across the `unit`
        # and `storybook` projects in one run and only honours the option at
        # the root, so this single invocation is what the floors are measured
        # against — the story tests also run standalone in `web-storybook`,
        # where a story regression is attributed rather than averaged in.
        run: npm run test -- --coverage
      - name: Upload coverage
        # `json-summary` is the machine-readable copy WO-26 turns into
        # `coverage-summary.md` for the Gate 3 evidence pack, and the input
        # WO-31's ratchet reads.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: web/coverage
          if-no-files-found: warn
          retention-days: 14
      - name: Next.js build + route budgets
        # WO-24 / 05-MIGRATION.md C7. `npm run budgets` IS `npm run build &&
        # node scripts/route-budgets.mjs` (web/package.json), so the
        # production build this step replaced is still validated in full —
        # static generation of `/` and the server-side `/api` proxy route
        # included, with no API service and no secret needed at build time —
        # and the manifests it emits are then measured against
        # web/budgets.json. Running `npm run build` separately first would
        # build the app twice for one gate.
        #
        # There is no skip flag: route-budgets.mjs takes no arguments and
        # reads no environment variables, so a ceiling can only move by
        # editing budgets.json in the same commit (04 §8.4's ratchet rule).
        run: npm run budgets
      - name: Upload route budget report
        # `always()` on purpose: the report is written BEFORE the script exits
        # non-zero, so a breach uploads the evidence of its own breach.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-budget-report
          path: web/budget-report.md
          if-no-files-found: warn
          retention-days: 14

  web-audit:
    name: web dependency audit
    # WO-24 / 05-MIGRATION.md C4, moved out of the `web` job on 2026-09-04.
    #
    # WHAT THE GATE ASSERTS IS UNCHANGED. Two gates in one script
    # (web/scripts/audit-gate.mjs), because one would have had to be wrong:
    # `npm audit --audit-level=high --omit=dev` must report ZERO advisories and
    # has no exception mechanism, while the dev tree is checked against
    # web/audit-exceptions.json and fails on anything that file does not name —
    # or on an entry that no longer matches. C4's baseline of 0 was captured
    # before WO-06 added Storybook, whose framework package pulls an unfixed
    # `image-size` advisory; the split keeps that from becoming a reason to
    # lower `--audit-level`.
    #
    # WHY ITS OWN JOB. The gate's two `npm audit` calls are the only network
    # I/O in the whole web tier that depends on a service other than the
    # registry's package endpoints — npm's advisory database. When that service
    # degraded (2026-09-04), the audit ran 5-10 min per call and the `web` job
    # was cancelled at its 15-minute ceiling with typecheck, Vitest and the
    # build unreported. The old rationale for running it early — "so a red tree
    # is reported before the rest of the job spends five minutes on it" — is
    # better served here: as a separate job it reports even earlier, in
    # parallel, and its worst day cannot cancel a single unit test.
    #
    # IT IS STILL A HARD GATE. No `continue-on-error`. An audit that could not
    # run is RED, not green — the same principle audit-gate.mjs applies to a
    # non-JSON `npm audit` body. On 2026-09-04 the endpoint answered "0
    # advisories, all 10 exceptions stale" while the GitHub advisory database
    # still listed those advisories (image-size@2.0.2 GHSA-w3rx-r6r6-pgpr,
    # tmp@0.1.0 GHSA-ph9p-34f9-6g65, extract-zip@2.0.1 GHSA-jmr9-qjv8-65gv):
    # a data-source failure whose only correct outcome is a red job and a
    # rerun, never a deleted exception.
    runs-on: ubuntu-latest
    # Install (5) + audit (6) + checkout/setup, with the step bounds below
    # doing the real work. The job ceiling is the backstop, not the budget.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Keep in lockstep with web/Dockerfile and the `web` job.
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        # Same bounds as the `web` job's install; the reasoning is written out
        # there, in full, once.
        timeout-minutes: 5
        env:
          NPM_CONFIG_FETCH_TIMEOUT: "60000"
          NPM_CONFIG_FETCH_RETRIES: "2"
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "20000"
        run: npm ci
      - name: Dependency audit gate
        # 1 s on a green run (33731289742), 9m37s on the degraded one
        # (33847548135). The script makes two sequential `npm audit` POSTs, so
        # with the fetch bounds above its worst case is ~7 min and this
        # 6-minute ceiling is what actually stops it — deliberately: a run that
        # has spent six minutes failing to reach the advisory database has
        # already told us everything it is going to. Red, and rerun.
        timeout-minutes: 6
        env:
          NPM_CONFIG_FETCH_TIMEOUT: "60000"
          NPM_CONFIG_FETCH_RETRIES: "2"
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "20000"
        run: npm run audit:gate
      - name: Upload npm audit report
        # Collected into the Gate 4 evidence pack by WO-33. Moved here with the
        # step that writes it — `web` no longer produces this artifact.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-npm-audit
          path: web/npm-audit.json
          if-no-files-found: warn
          retention-days: 14

  web-storybook:
    name: web storybook (static build + story tests)
    # WO-24 / 05-MIGRATION.md C9. Two things this job proves that the `web`
    # job cannot:
    #
    #   1. `storybook build` succeeds. The `storybook` Vitest project renders
    #      every story through the addon's Vite pipeline, which is NOT the
    #      browser build — a story can pass as a test and still fail to bundle
    #      (a Node-only import, a missing static asset). Nothing before this
    #      job ever ran the static build in CI.
    #   2. A story regression is attributed to stories. In `web` the same
    #      tests run merged with the unit project so coverage can be measured
    #      across both in one process (Vitest only honours the coverage
    #      option at the root); here they run alone, so a red run names the
    #      tier.
    #
    # The static bundle is the artifact WO-26 indexes into the Gate 3
    # evidence pack as `storybook/` + `storybook-states.md`.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Keep in lockstep with web/Dockerfile and the `web` job.
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        # Same bounds as the `web` job's install; the reasoning is written out
        # there, in full, once. This install measured 16 s on a green run and
        # 6m15s on 2026-09-04's degraded registry (run 33847548135) — under
        # this job's ceiling only because it had little left to do afterwards.
        timeout-minutes: 5
        env:
          NPM_CONFIG_FETCH_TIMEOUT: "60000"
          NPM_CONFIG_FETCH_RETRIES: "2"
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "20000"
        run: npm ci
      - name: Story tests
        # The `storybook` project from web/vitest.config.mts: every story
        # rendered with the real preview decorators, with axe run over the
        # result at `test: "error"` (WO-06 criterion 3), so an inaccessible
        # story fails here rather than showing a panel nobody opens.
        run: npx vitest run --project=storybook
      - name: Storybook static build
        # Output goes to build/storybook, not storybook-static:
        # web/tests/tokens.test.ts scans every file under web/ for literal
        # colours and skips only node_modules, .next, out, build and .git.
        run: npm run build-storybook
      - name: Upload Storybook static build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-storybook
          path: web/build/storybook
          if-no-files-found: warn
          retention-days: 14

  web-e2e:
    name: web e2e (${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full matrix' || 'chromium' }} + axe)
    # WO-24 / 05-MIGRATION.md C8. Compose up → seed → Playwright + axe,
    # against the same seeded local stack WO-21 built for the desk
    # (web/e2e/README.md is its manual). Nothing in this job re-describes the
    # stack: `stack.sh` owns the Compose project name, both `-f` files and the
    # `--wait` on the healthchecks, which is also why no `sleep` appears here.
    #
    # THE COST BOUNDARY. `ANTHROPIC_API_KEY` below is the invalid sentinel,
    # hard-coded. It is never `${{ secrets.* }}` and must not become one: the
    # repository secret exists for the nightly eval and this tier must not be
    # able to reach a provider even by accident. Three independent mechanisms
    # back it up — compose.e2e.yml pins the same value on the `app` service,
    # playwright.config.ts overwrites it in the runner process before any test
    # loads and global-setup.ts refuses to start if it is anything else, and
    # support/paid-path.ts fulfils `POST /api/research` in the browser so the
    # submit leg never reaches the backend. web/tests/ci.test.ts asserts this
    # job's half of that against this file's own text.
    #
    # WALL CLOCK, MEASURED RATHER THAN ESTIMATED. `stack.sh up` builds both
    # images from source, and a GitHub runner's daemon starts with an empty
    # layer cache, so none of this shares `docker-build`'s `type=gha` buildx
    # cache — Compose builds through the daemon, not through the buildx
    # builder. That sounds worse than it measures: on this workflow's first
    # green run `up` took 2m36s (the runtime lock installs published wheels;
    # nothing compiles), the chromium suite 1m51s, and the job 5m13s end to
    # end. The ceiling below is headroom for the nightly, which runs five
    # projects instead of one, not a prediction about the per-PR path. If a
    # future dependency does make the image expensive to build, the fix is a
    # registry-published image (05 §3.1 B5 / R-12, a paused DEPLOY item), not
    # a cache trick that silently stops working.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Never a real key. See "THE COST BOUNDARY" above.
      ANTHROPIC_API_KEY: local-preview-disabled
      # WO-24 criterion 4: chromium only per PR; every project nightly.
      E2E_FULL_MATRIX: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Keep in lockstep with web/Dockerfile and the `web` job.
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        # Also what the StrictMode scenario's `next dev` server needs:
        # playwright.config.ts starts one on its own port for the single
        # assertion a production build cannot make (React's double effect
        # invocation is development-only).
        #
        # Same bounds as the `web` job's install; the reasoning is written out
        # there, in full, once. Measured 19 s on a green run (33731289742).
        timeout-minutes: 5
        env:
          NPM_CONFIG_FETCH_TIMEOUT: "60000"
          NPM_CONFIG_FETCH_RETRIES: "2"
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "20000"
        run: npm ci
      - name: Install Playwright browsers
        # Downloading firefox and webkit on every PR would add minutes for
        # browsers no PR job runs. `e2e:install` is the three-browser form.
        #
        # The other network step in this job, and it does NOT go to the npm
        # registry — Playwright fetches its own browser bundles from its CDN
        # and `--with-deps` runs apt, so the fetch settings above do not reach
        # it and a step bound is the only thing that can. 2m02s measured for
        # the full three-browser matrix (33731289742); 10 min is five times
        # that, so it fires only when a download is genuinely stuck.
        timeout-minutes: 10
        run: |
          if [ "$E2E_FULL_MATRIX" = "true" ]; then
            npm run e2e:install
          else
            npx playwright install --with-deps chromium
          fi
      - name: Compose up (seeded stack, disabled API key)
        # `docker compose up -d --build --wait`, under the isolating overlay
        # web/e2e/support/compose.e2e.yml. `--wait` blocks on the
        # healthchecks the base file declares, so the seed cannot race an
        # unmigrated Postgres or a booting app.
        #
        # The third network step in this job and the last one in the file to
        # get a bound: it pulls base images, builds both application images and
        # installs the runtime lock inside one of them. 2m36s on the first
        # green run, recorded in this job's own header above; thirteen minutes
        # is 5x that, the multiple the Playwright bound uses, and it leaves
        # seventeen for a remainder that measures ~4 min per PR. `--wait`
        # blocking on a healthcheck that never goes green is exactly the shape
        # of hang a job ceiling turns into "the browser tier reported nothing".
        timeout-minutes: 13
        run: npm run e2e:stack:up
      - name: Seed the fixtures
        # Writes only `baseline-*` rows, directly into Postgres and Redis —
        # behind the API, so there is no code path from this tier to a model.
        run: npm run e2e:stack:seed
      - name: Playwright + axe
        # The `chromium` project is the per-PR set and carries the whole axe
        # sweep (`@axe` is grepped into chromium only: the twelve retained
        # baseline reports were taken in Chrome, so a WebKit contrast
        # measurement would be a different measurement, not a stricter one).
        # No argument at all is every project, which is the nightly set.
        run: |
          if [ "$E2E_FULL_MATRIX" = "true" ]; then
            npm run e2e
          else
            npm run e2e -- --project=chromium
          fi
      - name: Capture the proxy request log
        # WO-30 / 05-MIGRATION.md C6. The suite has just driven every §4 state
        # through the same-origin proxy, so the web container's stdout now
        # holds one structured line per request. `ci/proxy-log-sample.txt` is
        # the committed sample and web/tests/proxyLogging.test.ts gates it;
        # this captures the RUN's lines beside the other artifacts, so an
        # incident can be read against the run that produced it rather than
        # against a file somebody refreshed by hand months ago.
        #
        # `|| true` and `always()`: a red suite is exactly when this log is
        # worth having, and a container that never started must not turn a
        # test failure into a second, misleading one.
        if: always()
        run: |
          mkdir -p build/e2e
          docker logs arxiv-wo21-web 2>&1 \
            | grep '"event":"api_proxy_request"' \
            > build/e2e/proxy-log.txt || true
          wc -l build/e2e/proxy-log.txt || true
      - name: Upload traces, screenshots, axe JSON, CSP sweep, proxy log
        # web/build/e2e holds all of it: test-results/ (traces, screenshots,
        # video — retained on failure), report/, results.json,
        # research-post-count.txt, axe/*.json + the summary/baseline-map/
        # contrast-proof TSVs WO-26 diffs against docs/revamp/baseline/axe/,
        # and WO-30's csp/sweep.tsv (one row per §4 state: mode, violation
        # count, console count) plus proxy-log.txt from the step above.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-${{ github.run_id }}
          path: web/build/e2e
          if-no-files-found: warn
          retention-days: 14
      - name: Stack logs on failure
        # A red Playwright run against a broken stack looks like a product
        # defect until you read the app container's log. `stack.sh logs`
        # carries `-p` and both `-f` files, like every other invocation.
        if: failure()
        run: bash ./e2e/support/stack.sh logs --no-color --tail 200 || true
      - name: Tear down
        # Always, and only ever through stack.sh — a bare `docker compose
        # down` resolves the project from the working directory and the base
        # file's hardcoded container names, which is how one stack removes
        # another's containers (06-WORK-ORDERS.md §5.4).
        if: always()
        run: npm run e2e:stack:down || true
