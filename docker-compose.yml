# Compose stack for local development and the base of the Hetzner deployment.
#
#   app        FastAPI + workflow (built from ./Dockerfile).
#   web        Next.js UI (ADR 0029/0054). Browser calls stay same-origin
#              at /api; the server route proxies to app over Compose.
#   redis      RedisJobStore backing store (Sprint 4 PR 3, ADR 0027).
#   postgres   Paper cache + embedding cache (Sprint 4 PR 4, ADR 0028).
#
# Persistence via named volumes so a `docker compose down` preserves
# job records + paper cache across restarts. `docker compose down -v`
# wipes everything.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: arxiv-research-agent:local
    container_name: arxiv-research-agent-app
    restart: unless-stopped
    # ADR 0042: bounded drain, via the canonical entry point.
    # `src.api.serve` sets `log_config=None` (the JSON stream stays
    # ours; the Dockerfile CMD's `--log-config /dev/null` does not
    # boot — `fileConfig` rejects an empty file, so the CLI has no
    # way to say "no log config") and `timeout_graceful_shutdown=10`:
    # uvicorn stops accepting on SIGTERM, waits up to 10s for open
    # SSE streams, then runs the lifespan cleanup (cancel in-flight
    # jobs, close pools). The container grace period must sit ABOVE
    # that drain so the cleanup isn't SIGKILLed mid-way — without
    # this, every `docker compose down` turned healthy in-flight
    # jobs into `orphaned` failures. Host/port come from the
    # API_HOST/API_PORT env below.
    #
    # ADR 0047 lengthened that cleanup: cancelling in-flight jobs now
    # waits for their graph-node *threads* to unwind (bounded by
    # `runner.SHUTDOWN_DRAIN_SEC`), then joins the node pool under the
    # same ceiling. Worst case is uvicorn's 10s + ~5s + ~5s, so the
    # grace period moved from 15s to 30s to stay above the chain.
    command: ["python", "-m", "src.api.serve"]
    stop_grace_period: 30s
    # Loopback by default. Docker-published ports can bypass a host's
    # ufw rules, and the browser no longer needs direct API access now
    # that the web service owns the authenticated /api proxy (ADR 0054).
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
    environment:
      # Anthropic key must come from the host env — never bake into
      # the image. `docker compose up` errors clearly if it's unset
      # because the workflow refuses to boot without it.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY must be set on the host}
      # Wire the API layer to the Redis + Postgres services below.
      # Names resolve on the compose default network.
      JOB_STORE: redis
      REDIS_URL: redis://redis:6379/0
      POSTGRES_URL: postgresql://${POSTGRES_USER:-arxiv}:${POSTGRES_PASSWORD:-arxiv}@postgres:5432/${POSTGRES_DB:-arxiv}
      # Sprint 4 PR 4: shared caches for extracted paper text +
      # MiniLM embeddings, backed by the Postgres service. Setting
      # these to `disk` / `none` reverts to Sprint 1 behavior.
      PAPER_CACHE: postgres
      EMBEDDING_CACHE: postgres
      # ADR 0034: share LangGraph checkpoints across API workers via
      # Postgres. Required for HITL to work under multi-worker
      # uvicorn — the ADR-0013 SqliteSaver is single-writer only.
      # Set to `sqlite` to revert to per-worker checkpoints.
      CHECKPOINT_BACKEND: postgres
      # ADR 0032: conversations are durable + shared across workers
      # only under the Postgres store. The default is `memory`, which
      # is per-worker and dies with the process — a `GET
      # /conversations/{id}` landing on another worker would 404.
      CONVERSATION_STORE: postgres
      # ADR 0037: share the per-key rate-limit counter across API
      # workers via Redis ZSET. Under the memory backend the
      # effective limit becomes `api_key_hourly_limit * n_workers`,
      # which defeats the point once auth is on.
      RATE_LIMIT_BACKEND: redis
      # ADR 0038: reconcile jobs orphaned by a worker that died
      # mid-run. Only meaningful under `JOB_STORE=redis`, where a
      # non-terminal row outlives the process that owned it.
      ENABLE_JOB_REDRIVER: "true"
      # Browser traffic is same-origin through web's /api proxy. Keep
      # CORS disabled unless a separate trusted client genuinely needs
      # cross-origin access; if enabled, use an explicit allowlist.
      API_CORS_ALLOW_ORIGINS: ${API_CORS_ALLOW_ORIGINS:-}
      # ADR 0042: auth is off by default so `docker compose up` stays
      # a zero-config demo, but the mitigation documented in
      # docs/security.md must be genuinely bootable. To turn it on:
      #
      #   ENABLE_API_AUTH=true API_KEYS="ops:sk_change_me" docker compose up
      #
      # `/healthz` stays auth-exempt, so the healthcheck below (and
      # the `web` service's service_healthy gate) keep passing with
      # auth on. Set WEB_API_KEY to the secret half of one API_KEYS
      # entry so the server-only web proxy can authenticate upstream.
      ENABLE_API_AUTH: ${ENABLE_API_AUTH:-false}
      API_KEYS: ${API_KEYS:-}
      # WO-W15: serve the repo-shipped learning paths. On here — and
      # only here — because `docker compose up` is the zero-config demo
      # and the only path it can publish is the *labeled fixture* one,
      # whose banner says so in every response. The setting's own
      # default is off (`src/config.py`), and the production overlay
      # sets it back to false: nothing real publishes until its
      # briefings are generated and reviewed.
      ENABLE_LEARN_CONTENT: ${ENABLE_LEARN_CONTENT:-true}
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      LOG_LEVEL: INFO
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: arxiv-research-agent-web:local
    container_name: arxiv-research-agent-web
    restart: unless-stopped
    environment:
      # Browser requests stay same-origin at `/api`; the Next.js route
      # handler forwards over the private compose network. When API auth
      # is enabled, set WEB_API_KEY to the secret portion of one API_KEYS
      # entry (for example API_KEYS="web:secret", WEB_API_KEY="secret").
      # The key remains server-side and is never baked into browser JS.
      API_INTERNAL_BASE: http://app:8000
      ARXIV_API_KEY: ${WEB_API_KEY:-}
      # WO-30 / 05-MIGRATION.md C3. The Content-Security-Policy the Next
      # middleware writes on every document response. `enforce` is the
      # default and needs no entry here; the variable exists because C3's
      # rollout is "ship Report-Only first ... then flip to enforcing", and
      # `CSP_MODE=report-only` is that first half — a switch an operator can
      # turn without a rebuild, which is what makes an observation window
      # possible on a real deployment. `off` exists for `next dev` only.
      CSP_MODE: ${CSP_MODE:-enforce}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      app:
        condition: service_healthy
    # WO-30 / 05-MIGRATION.md C5 + 04-ARCHITECTURE.md §11 item 12. The old
    # probe fetched Next `/`, which a container with a misconfigured
    # API_INTERNAL_BASE serves perfectly well while every API call 503s. This
    # one goes through the proxy to `/api/healthz`: a 200 proves the upstream
    # was reached. It deliberately does NOT fail on `status: degraded` —
    # `/healthz` is always 200 by design (ADR 0042) and a Redis blip is a
    # backend fault, not a reason to restart the web tier — but it does parse
    # `status` and `dependencies` and print them, because HTTP 200 alone
    # never means healthy (H10). `docker inspect` keeps the last five of
    # those lines.
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: arxiv-research-agent-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # No host port publish by default — the app talks to it over the
    # compose network only. Uncomment to inspect from `redis-cli`
    # on the host during debugging.
    # ports:
    #   - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: arxiv-research-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arxiv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arxiv}
      POSTGRES_DB: ${POSTGRES_DB:-arxiv}
    # No host port publish by default (see redis note above).
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Double dollars defer expansion to the container so the probe
      # follows the configured role/database instead of hard-coding it.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  redis-data:
  postgres-data:
