# Isolated D5 storage; no worker, recurrence or provider service.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: workspace-local-only
      POSTGRES_DB: workspace_d5
    ports:
      - "127.0.0.1:15488:5432"
    volumes:
      - d5-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspace -d workspace_d5"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  d5-data:
