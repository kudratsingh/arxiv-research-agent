# Prometheus config for the optional observability overlay.
#
# NOT part of the default stack. Prometheus is here because alert rules
# with nothing evaluating them are decorative: `alerts.yml` is the
# deliverable, and this is the twenty lines that make it runnable.
#
# It scrapes the collector, not the app. The app speaks OTLP push and
# exposes no `/metrics` endpoint; the collector's `prometheus` exporter
# is what turns the push into a scrape target.

global:
  # 15s to match the collector's own aggregation cadence closely enough
  # that a 5m rate window holds ~20 samples. The app's
  # `OTEL_METRIC_EXPORT_INTERVAL_SEC` is the real floor on freshness —
  # scraping faster than the app pushes buys nothing but repeated
  # samples, so the overlay sets that to 15 as well.
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

# No `alerting:` block. Routing a page is a decision about who is woken
# up at 3am, and this repository has no on-call rota to encode. Add an
# Alertmanager here when there is somebody to route to; until then the
# rules are readable in Prometheus' own alerts view, which is the
# honest state of "we can see it" versus "we get told".
