<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="arxiv-research-agent">
  <!--
    Next emits this file as the site icon, which closes the /favicon.ico
    404 that cost Best Practices on all six baseline Lighthouse audits
    (05-MIGRATION.md section 3.1, B1). It is an app/ file, NOT a public/
    file, so web/Dockerfile line 36's "public/ is optional" comment stays
    accurate and the image needs no new COPY.

    The mark is the trace spine: a checkpoint column in the signature
    hue with the observations it produced beside it.

    The hex values below are the one documented exemption to "tokens.css
    is the only file in web/ containing a literal colour" (WO-01 c1). A
    favicon is painted by the browser chrome with no document to inherit
    a custom property from, and currentColor resolves to black there, so
    the marks must carry their own values. They are copied from
    docs/revamp/design/tokens.json: canvas/surface/signature/ink of the
    dark theme, which reads on both a light and a dark browser chrome.
  -->
  <rect width="32" height="32" rx="6" fill="#0E1A1E" />
  <rect x="10" y="6" width="2" height="20" rx="1" fill="#58C7C2" />
  <circle cx="11" cy="9" r="3" fill="#58C7C2" />
  <circle cx="11" cy="16" r="3" fill="#58C7C2" />
  <circle cx="11" cy="23" r="3" fill="#15252B" stroke="#58C7C2" stroke-width="1.5" />
  <rect x="17" y="8" width="9" height="2" rx="1" fill="#E8F1F3" />
  <rect x="17" y="15" width="7" height="2" rx="1" fill="#E8F1F3" />
  <rect x="17" y="22" width="5" height="2" rx="1" fill="#8CA5AC" />
</svg>
